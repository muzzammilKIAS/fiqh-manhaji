/* IndexedDB لحفظ البيانات الكبيرة (مع رجوع إلى localStorage) */
const idb = {
  _db: null,
  open() {
    if (this._db) return Promise.resolve(this._db);
    return new Promise((res, rej) => {
      if (!('indexedDB' in window)) return rej(new Error('no-idb'));
      const r = indexedDB.open('fiqh-manhaji', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => { this._db = r.result; res(r.result); };
      r.onerror = () => rej(r.error);
    });
  },
  async get(k) { try { const db = await this.open(); return await new Promise((res, rej) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result ?? null); q.onerror = () => rej(q.error); }); } catch (e) { return null; } },
  async set(k, v) { try { const db = await this.open(); await new Promise((res, rej) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); return true; } catch (e) { log.warn('IndexedDB غير متاح', e); return false; } },
  async del(k) { try { const db = await this.open(); await new Promise(res => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').delete(k); t.oncomplete = res; t.onerror = res; }); } catch (e) {} }
};
async function saveUserData(d) { if (await idb.set('data', d)) { store.del('data'); return true; } return store.set('data', d); }
async function loadUserData() { const v = await idb.get('data'); if (hasAnyData(v)) return v; const l = store.get('data', null); return hasAnyData(l) ? l : null; }
async function clearUserData() { await idb.del('data'); store.del('data'); }

/* ======================= ARABIC NORMALIZATION (للبحث فقط) ======================= */
const DIAC = /[\u0610-\u061A\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/;
function normChar(ch) {
  if (DIAC.test(ch)) return '';
  switch (ch) {
    case 'أ': case 'إ': case 'آ': case 'ٱ': return 'ا';
    case 'ى': return 'ي';
    case 'ة': return 'ه';
    case 'ؤ': return 'و';
    case 'ئ': return 'ي';
  }
  return ch.toLowerCase();
}
function norm(s) { let o = ''; const t = String(s ?? ''); for (let i = 0; i < t.length; i++) o += normChar(t[i]); return o.replace(/\s+/g, ' ').trim(); }
function normMap(text) { let n = '', map = []; for (let i = 0; i < text.length; i++) { const c = normChar(text[i]); for (let k = 0; k < c.length; k++) { n += c[k]; map.push(i); } } return { n, map }; }
function queryTerms(q) {
  return norm(q).split(' ').filter(Boolean).map(t => { const v = [t]; if (t.startsWith('ال') && t.length > 4) v.push(t.slice(2)); return v; });
}
function highlight(text, terms) {
  text = String(text ?? '');
  const flat = terms.flat().filter(Boolean).sort((a, b) => b.length - a.length);
  if (!flat.length) return esc(text);
  const { n, map } = normMap(text);
  let ranges = [];
  for (const t of flat) { let p = n.indexOf(t); while (p !== -1) { let s = map[p], e = map[p + t.length - 1] + 1; while (e < text.length && normChar(text[e]) === '') e++; ranges.push([s, e]); p = n.indexOf(t, p + t.length); } }
  if (!ranges.length) return esc(text);
  ranges.sort((a, b) => a[0] - b[0]);
  const merged = [ranges[0]];
  for (const r of ranges.slice(1)) { const l = merged[merged.length - 1]; if (r[0] <= l[1]) l[1] = Math.max(l[1], r[1]); else merged.push(r); }
  let out = '', pos = 0;
  for (const [s, e] of merged) { out += esc(text.slice(pos, s)) + '<mark>' + esc(text.slice(s, e)) + '</mark>'; pos = e; }
  return out + esc(text.slice(pos));
}
function snippet(text, terms, len = 170) {
  text = String(text ?? ''); if (!text) return '';
  const { n, map } = normMap(text); let pos = -1;
  for (const t of terms.flat()) { const p = n.indexOf(t); if (p !== -1 && (pos === -1 || p < pos)) pos = p; }
  const start = pos > -1 ? Math.max(0, map[pos] - 50) : 0;
  const s = text.slice(start, start + len);
  return (start > 0 ? '… ' : '') + highlight(s, terms) + (start + len < text.length ? ' …' : '');
}

/* ======================= DATA LAYER ======================= */
const COLS = [['books', 'book_id'], ['volumes', 'volume_id'], ['chapters', 'chapter_id'], ['sections', 'section_id'], ['topics', 'topic_id'], ['issues', 'issue_id'], ['evidences', 'evidence_id'], ['references', 'reference_id'], ['headings', 'heading_id'], ['summaries', 'summary_id']];
const COL_AR = { books: 'الكتب', volumes: 'الأجزاء', chapters: 'الأبواب', sections: 'الفصول', topics: 'الموضوعات', issues: 'المسائل', evidences: 'الأدلة', references: 'المراجع', headings: 'العناوين الفرعية', summaries: 'الملخصات' };
const DB = { raw: null, mode: 'none', idx: {}, warnings: [], rows: [] };

function emptyData() { const d = { meta: {} }; COLS.forEach(([c]) => d[c] = []); return d; }
function hasAnyData(o) { return !!o && COLS.some(([c]) => Array.isArray(o[c]) && o[c].length); }

function setData(obj, mode) {
  const d = emptyData(), pre = [];
  if (obj && typeof obj === 'object') {
    d.meta = obj.meta && typeof obj.meta === 'object' ? obj.meta : {};
    COLS.forEach(([c]) => {
      const src = Array.isArray(obj[c]) ? obj[c] : [];
      d[c] = src.filter((o, i) => { const ok = o && typeof o === 'object'; if (!ok) pre.push(`تحذير: عنصر غير صالح في ${c} (الموضع ${i + 1}).`); return ok; });
    });
  }
  DB.raw = d;
  DB.mode = hasAnyData(d) ? mode : 'none';
  buildIndexes();
  DB.warnings = pre.concat(validate());
  buildSearchRows();
  DB.warnings.forEach(w => log.warn(w));
  log.info('حالة البيانات:', DB.mode, counts());
}

const BLOCKS = new Map();
function group(list, key) { const m = new Map(); list.forEach(o => { const k = sid(o[key]); if (!k) return; if (!m.has(k)) m.set(k, []); m.get(k).push(o); }); return m; }
const byOrder = (a, b) => toNum(a.order) - toNum(b.order) || 0;

function buildIndexes() {
  const d = DB.raw, I = {};
  COLS.forEach(([c, k]) => { I[c] = new Map(); d[c].forEach(o => { if (has(o[k]) && !I[c].has(sid(o[k]))) I[c].set(sid(o[k]), o); }); });
  I.babChapter = new Map(); I.chapterBab = new Map();
  BABS.forEach(b => { const ch = d.chapters.find(c => c.key === b.key || norm(c.title) === norm(b.title)); if (ch && has(ch.chapter_id)) { I.babChapter.set(b.key, ch); I.chapterBab.set(sid(ch.chapter_id), b.key); } });
  I.sectionsByChapter = group(d.sections, 'chapter_id');
  I.issuesByTopic = group(d.issues, 'topic_id');
  I.headingsByTopic = group(d.headings, 'topic_id');
  I.headingKids = group(d.headings, 'parent_id');
  I.summaryBy = new Map(d.summaries.filter(x => has(x.level) && has(x.target_id)).map(x => [x.level + ':' + sid(x.target_id), x]));
  BLOCKS.clear();
  DB.idx = I;
  I.topicsByChapter = new Map();
  d.topics.forEach(t => { const cid = topicChapterId(t); if (!cid) return; if (!I.topicsByChapter.has(cid)) I.topicsByChapter.set(cid, []); I.topicsByChapter.get(cid).push(t); });
  [I.sectionsByChapter, I.issuesByTopic, I.topicsByChapter, I.headingsByTopic, I.headingKids].forEach(m => m.forEach(l => l.sort(byOrder)));
}
function topicChapterId(t) { if (has(t.chapter_id)) return sid(t.chapter_id); const s = DB.idx.sections.get(sid(t.section_id)); return s ? sid(s.chapter_id) : ''; }

function issueCtx(is) {
  const I = DB.idx;
  const topic = I.topics.get(sid(is.topic_id)) || null;
  const section = I.sections.get(sid(has(is.section_id) ? is.section_id : topic?.section_id)) || null;
  const chapter = I.chapters.get(sid(has(is.chapter_id) ? is.chapter_id : (topic ? topicChapterId(topic) : section?.chapter_id))) || null;
  const refs = arr(is.reference_ids).map(id => I.references.get(sid(id))).filter(Boolean);
  const r0 = refs[0];
  const volume = I.volumes.get(sid(has(is.volume_id) ? is.volume_id : r0?.volume_id)) || null;
  const page = has(is.page) ? is.page : r0?.page;
  const book = I.books.get(sid(has(is.book_id) ? is.book_id : (r0?.book_id ?? volume?.book_id))) || null;
  const babKey = chapter ? I.chapterBab.get(sid(chapter.chapter_id)) || null : null;
  return { topic, section, chapter, refs, volume, page, book, babKey };
}

/* ---------- Data Validation ---------- */
function validate() {
  const d = DB.raw, I = DB.idx, W = [];
  const one = { books: 'الكتاب', volumes: 'الجزء', chapters: 'الباب', sections: 'الفصل', topics: 'الموضوع', issues: 'المسألة', evidences: 'الدليل', references: 'المرجع', headings: 'العنوان', summaries: 'الملخص' };
  COLS.forEach(([c, k]) => {
    const seen = new Set();
    d[c].forEach((o, i) => {
      if (!has(o[k])) { W.push(`تحذير: ${one[c]} في الموضع ${i + 1} بلا معرّف (${k}).`); return; }
      const id = sid(o[k]);
      if (seen.has(id)) W.push(`تحذير: معرّف مكرر في ${COL_AR[c]}: ${id}.`);
      seen.add(id);
      if (['books', 'chapters', 'sections', 'topics', 'issues', 'headings'].includes(c) && !has(o.title)) W.push(`تحذير: ${one[c]} رقم ${id} بلا عنوان.`);
    });
  });
  d.chapters.forEach(ch => { if (has(ch.chapter_id) && !I.chapterBab.has(sid(ch.chapter_id))) W.push(`تنبيه: الباب ${ch.chapter_id} («${ch.title ?? ''}») خارج أبواب العبادات الخمسة ولن يظهر في الواجهة.`); });
  d.headings.forEach(h => {
    if (has(h.heading_id) && !I.topics.has(sid(h.topic_id))) W.push(`تحذير: العنوان ${h.heading_id} يشير إلى موضوع غير موجود (${h.topic_id}).`);
    if (has(h.parent_id) && !I.headings.has(sid(h.parent_id))) W.push(`تحذير: العنوان ${h.heading_id} يشير إلى عنوان أب غير موجود (${h.parent_id}).`);
    if (has(h.issue_id) && !I.issues.has(sid(h.issue_id))) W.push(`تحذير: العنوان ${h.heading_id} يشير إلى مسألة غير موجودة (${h.issue_id}).`);
  });
  d.volumes.forEach(v => { if (has(v.book_id) && !I.books.has(sid(v.book_id))) W.push(`تحذير: الجزء ${v.volume_id} يشير إلى كتاب غير موجود (${v.book_id}).`); });
  d.sections.forEach(s => {
    if (!has(s.chapter_id)) W.push(`تحذير: الفصل ${s.section_id} غير مرتبط بباب.`);
    else if (!I.chapters.has(sid(s.chapter_id))) W.push(`تحذير: الفصل ${s.section_id} يشير إلى باب غير موجود (${s.chapter_id}).`);
  });
  d.topics.forEach(t => {
    if (has(t.section_id) && !I.sections.has(sid(t.section_id))) W.push(`تحذير: الموضوع ${t.topic_id} يشير إلى فصل غير موجود (${t.section_id}).`);
    const cid = topicChapterId(t);
    if (!cid) W.push(`تحذير: الموضوع ${t.topic_id} غير مرتبط بباب.`);
    else if (!I.chapters.has(cid)) W.push(`تحذير: الموضوع ${t.topic_id} يشير إلى باب غير موجود (${cid}).`);
    arr(t.reference_ids).forEach(r => { if (!I.references.has(sid(r))) W.push(`تحذير: الموضوع ${t.topic_id} يشير إلى مصدر غير موجود (${r}).`); });
    arr(t.evidence_ids).forEach(e => { if (!I.evidences.has(sid(e))) W.push(`تحذير: الموضوع ${t.topic_id} يشير إلى دليل غير موجود (${e}).`); });
  });
  const dup = new Map();
  d.issues.forEach(is => {
    const id = is.issue_id;
    if (!has(is.topic_id)) W.push(`تحذير: المسألة رقم ${id} غير مرتبطة بموضوع.`);
    else if (!I.topics.has(sid(is.topic_id))) W.push(`تحذير: المسألة رقم ${id} تشير إلى موضوع غير موجود (${is.topic_id}).`);
    if (!arr(is.reference_ids).length) W.push(`تحذير: المسألة رقم ${id} بلا مصدر.`);
    arr(is.reference_ids).forEach(r => { if (!I.references.has(sid(r))) W.push(`تحذير: المسألة رقم ${id} تشير إلى مصدر غير موجود (${r}).`); });
    arr(is.evidence_ids).forEach(e => { if (!I.evidences.has(sid(e))) W.push(`تحذير: المسألة رقم ${id} تشير إلى دليل غير موجود (${e}).`); });
    arr(is.related_issue_ids).forEach(r => { if (!I.issues.has(sid(r))) W.push(`تحذير: المسألة رقم ${id} تشير إلى مسألة مرتبطة غير موجودة (${r}).`); });
    arr(is.khilaf).forEach(k => { if (k && has(k.reference_id) && !I.references.has(sid(k.reference_id))) W.push(`تحذير: قول في خلاف المسألة ${id} يشير إلى مصدر غير موجود (${k.reference_id}).`); });
    const key = sid(is.topic_id) + '|' + norm(is.title);
    if (has(is.title)) { if (dup.has(key)) W.push(`تنبيه: احتمال تكرار: المسألتان ${dup.get(key)} و${id} بالعنوان نفسه في الموضوع نفسه.`); else dup.set(key, id); }
  });
  d.references.forEach(r => {
    if (!has(r.book_id)) W.push(`تنبيه: المرجع ${r.reference_id} بلا كتاب (book_id).`);
    else if (!I.books.has(sid(r.book_id))) W.push(`تحذير: المرجع ${r.reference_id} يشير إلى كتاب غير موجود (${r.book_id}).`);
    if (has(r.volume_id) && !I.volumes.has(sid(r.volume_id))) W.push(`تحذير: المرجع ${r.reference_id} يشير إلى جزء غير موجود (${r.volume_id}).`);
  });
  d.evidences.forEach(e => {
    if (!has(e.text)) W.push(`تحذير: الدليل ${e.evidence_id} بلا نص.`);
    if (has(e.reference_id) && !I.references.has(sid(e.reference_id))) W.push(`تحذير: الدليل ${e.evidence_id} يشير إلى مصدر غير موجود (${e.reference_id}).`);
  });
  return W;
}

/* ---------- Search index ---------- */
function volLabel(v) { if (!v) return ''; return has(v.number) ? `جـ ${v.number}` : (has(v.title) ? String(v.title) : ''); }
function buildSearchRows() {
  DB.rows = DB.raw.issues.filter(is => has(is.issue_id)).map((is, i) => {
    const c = issueCtx(is);
    const authors = c.book ? arr(c.book.authors) : [];
    const f = [
      [is.title, 10], [arr(is.keywords).join(' '), 6], [c.topic?.title, 5], [is.ruling, 4],
      [c.section?.title, 3], [c.chapter?.title, 3], [is.original_text, 2],
      [authors.join(' '), 1], [c.book?.title, 1], [volLabel(c.volume), 1], [has(c.page) ? String(c.page) : '', 1]
    ].map(([t, w]) => [norm(t), w]);
    const evTypes = new Set(arr(is.evidence_ids).map(e => DB.idx.evidences.get(sid(e))?.type).filter(Boolean));
    return { is, c, f, evTypes, authors, order: i };
  });
}
const babIdx = key => { const i = BABS.findIndex(b => b.key === key); return i < 0 ? 99 : i; };

function runSearch(q, F) {
  const terms = queryTerms(q);
  let rows = DB.rows.filter(r => {
    if (F.bab && r.c.babKey !== F.bab) return false;
    if (F.vol && sid(r.c.volume?.volume_id) !== F.vol) return false;
    if (F.sec && sid(r.c.section?.section_id) !== F.sec) return false;
    if (F.topic && sid(r.c.topic?.topic_id) !== F.topic) return false;
    if (F.author && !r.authors.includes(F.author)) return false;
    if (F.book && sid(r.c.book?.book_id) !== F.book) return false;
    if (F.type) { if (F.type === 'khilaf') { if (!arr(r.is.khilaf).length) return false; } else if (!r.evTypes.has(F.type)) return false; }
    return true;
  });
  if (!terms.length) return { terms, rows: rows.slice().sort((a, b) => babIdx(a.c.babKey) - babIdx(b.c.babKey) || a.order - b.order) };
  const out = [];
  rows.forEach(r => {
    let score = 0;
    for (const variants of terms) {
      let s = 0;
      for (const [txt, w] of r.f) {
        if (!txt) continue;
        for (const v of variants) { if (txt.includes(v)) { s += w * (txt === v ? 3 : (txt.startsWith(v) || txt.includes(' ' + v)) ? 1.5 : 1); break; } }
      }
      if (!s) return;
      score += s;
    }
    out.push(Object.assign({}, r, { score }));
  });
  out.sort((a, b) => b.score - a.score || babIdx(a.c.babKey) - babIdx(b.c.babKey) || (toNum(a.c.volume?.number) - toNum(b.c.volume?.number)) || (toNum(a.c.page) - toNum(b.c.page)) || a.order - b.order);
  return { terms, rows: out };
}

  d.books.push({ book_id: 'demo-b1', title: '[مصدر تجريبي – يُستبدل ببيانات الكتاب]', authors: ['[مؤلف تجريبي]'] });
  d.volumes.push({ volume_id: 'demo-v1', book_id: 'demo-b1', number: '[تجريبي]' });
  let rn = 0, en = 0, inn = 0;
  BABS.forEach((b, bi) => {
    const cid = 'demo-c' + (bi + 1), sec = 'demo-s' + (bi + 1);
    d.chapters.push({ chapter_id: cid, key: b.key, title: b.title, description: '[وصف تجريبي للباب] ' + P, order: bi + 1 });
    d.sections.push({ section_id: sec, chapter_id: cid, title: '[فصل تجريبي]', order: 1 });
    const nT = bi < 2 ? 2 : 1;
    for (let t = 1; t <= nT; t++) {
      const tid = `demo-t${bi + 1}-${t}`, rid = 'demo-r' + (++rn);
      d.references.push({ reference_id: rid, book_id: 'demo-b1', volume_id: 'demo-v1', chapter_title: b.title, section_title: '[فصل تجريبي]', page: '[تجريبي]' });

      if (bi === 0 && t === 1) topic.arkan = [{ text: '[بند تجريبي أول]', explanation: P, reference_id: rid }, { text: '[بند تجريبي ثانٍ]', explanation: P, reference_id: rid }];
      d.topics.push(topic);
      const nI = bi < 2 ? 2 : 1;
      for (let k = 1; k <= nI; k++) {
        const iid = 'demo-i' + (++inn), eq = 'demo-e' + (++en), eh = 'demo-e' + (++en);
        d.evidences.push({ evidence_id: eq, type: 'quran', text: '[نص آية تجريبي – يُستبدل من قاعدة البيانات]', surah: '[السورة]', ayah: '[الآية]', reference_id: rid });
        d.evidences.push({ evidence_id: eh, type: 'hadith', text: '[نص حديث تجريبي – يُستبدل من قاعدة البيانات]', narrator: '[الراوي]', collection: '[المصدر]', reference_id: rid });
        const issue = {
          issue_id: iid, topic_id: tid, title: `[مسألة تجريبية ${inn}]`,
          original_text: `${P}\nنص تجريبي لعرض شكل «النص الأصلي» في باب ${b.title}، وليس نقلاً عن أي كتاب.`,
          ruling: '[حكم تجريبي] ' + P, keywords: ['تجريبي', b.title],
          evidence_ids: [eq, eh], reference_ids: [rid], volume_id: 'demo-v1', page: '[تجريبي]', order: k
        };
        if (k === 1) issue.explanation = '[شرح تجريبي] ' + P;
        d.issues.push(issue);
      }
    }
  });
  d.issues[0].related_issue_ids = ['demo-i2', 'demo-i3'];
  d.issues[0].notes = '[ملاحظة تجريبية] ' + P;
  d.issues[0].khilaf = [{ qawl: '[قول تجريبي أول]', attributed_to: '[نسبة تجريبية]', reference_id: 'demo-r1' }, { qawl: '[قول تجريبي ثانٍ – بلا نسبة لعرض حالة النقص]' }];
  d.issues[0].terms = [{ term: '[مصطلح تجريبي]', simple: '[شرح مبسط تجريبي]' }];
  d.references.push({ reference_id: 'demo-r-inc', book_id: 'demo-b1' });
  d.issues[1].reference_ids.push('demo-r-inc');
  return d;
}

function toast(msg) {

  $('#toasts').appendChild(t); setTimeout(() => t.remove(), 2400);
}
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; } catch (e) {
    try { const ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); return ok; } catch (e2) { return false; }
  }
}

let refNumbers = new Map();
function refNo(rid) {
  if (!refNumbers.size) DB.raw.references.forEach((r, i) => refNumbers.set(sid(r.reference_id), pad3(i + 1)));
  return refNumbers.get(sid(rid)) || '—';
}
function citeChip(rid) {
  if (!has(rid)) return '';

  return ok ? `<button class="cite" data-act="cite" data-ref="${esc(rid)}">[المصدر ${refNo(rid)}]</button>` : '';
}
function refFields(r) {
  const I = DB.idx, book = I.books.get(sid(r.book_id)), vol = I.volumes.get(sid(r.volume_id));
  const f = [];
  if (book) {
    if (has(book.title)) f.push(['الكتاب', esc(book.title)]);
    if (has(book.authors)) f.push(['المؤلف', esc(arr(book.authors).join('، '))]);
    if (has(book.publisher)) f.push(['الناشر', esc(book.publisher)]);
    if (has(book.edition)) f.push(['الطبعة', esc(book.edition)]);
    if (has(book.year)) f.push(['سنة النشر', esc(book.year)]);
  }
  if (vol && has(vol.number)) f.push(['الجزء', esc(vol.number)]);
  else if (vol && has(vol.title)) f.push(['الجزء', esc(vol.title)]);
  if (has(r.chapter_title)) f.push(['الباب', esc(r.chapter_title)]);
  if (has(r.section_title)) f.push(['الفصل', esc(r.section_title)]);
  if (has(r.page)) f.push(['الصفحة', esc(r.page)]);
  f.push(['معرّف المصدر', esc(r.reference_id)]);
  const links = [['url', 'رابط المصدر'], ['pdf_url', 'ملف PDF'], ['page_image_url', 'صورة الصفحة']].filter(([k]) => has(r[k]) && /^https?:\/\//i.test(r[k]));
  links.forEach(([k, l]) => f.push([l, `<a href="${esc(r[k])}" target="_blank" rel="noopener">عرض المصدر الأصلي</a>`]));
  const incomplete = !book || !has(r.page) || !vol;
  return `<dl class="fields">${f.map(([a, b]) => `<dt>${a}</dt><dd>${b}</dd>`).join('')}</dl>` + (incomplete ? `<p class="na" style="margin-top:.6rem">${MSG.REF_INCOMPLETE}</p>` : '');
}
function refPlain(r) {
  const I = DB.idx, book = I.books.get(sid(r.book_id)), vol = I.volumes.get(sid(r.volume_id));
  return [book?.title, book && has(book.authors) ? arr(book.authors).join('، ') : '', volLabel(vol), has(r.page) ? `صـ ${r.page}` : ''].filter(has).join('، ');
}

function listTable(items, colName) {
  const rows = arr(items).map(it => typeof it === 'string' ? { text: it } : (it || {})).filter(it => has(it.text));
  if (!rows.length) return '';
  const hasExp = rows.some(r => has(r.explanation)), hasRef = rows.some(r => has(r.reference_id));
  return `<div class="tbl-wrap"><table><thead><tr><th>الرقم</th><th>${colName}</th>${hasExp ? '<th>البيان</th>' : ''}${hasRef ? '<th>المصدر</th>' : ''}</tr></thead><tbody>
    ${rows.map((r, i) => `<tr><td class="num">${fmt(i + 1)}</td><td>${esc(r.text)}</td>${hasExp ? `<td>${has(r.explanation) ? esc(r.explanation) : ''}</td>` : ''}${hasRef ? `<td>${citeChip(r.reference_id)}</td>` : ''}</tr>`).join('')}
  </tbody></table></div>`;
}
function blk(title, inner, cls = '') { return `<section class="blk ${cls}"><h2>${title}</h2><div class="body">${inner}</div></section>`; }

function viewTopic(id) {
  const t = Api.getTopicById(id);
  if (!t) return viewNotFound('الموضوع');
  const cid = topicChapterId(t), key = DB.idx.chapterBab.get(cid), sec = DB.idx.sections.get(sid(t.section_id));
  currentNav = key ? 'bab:' + key : '';
  crumbs([HOME, IBADAT, babCrumb(key), sec ? { label: sec.title } : null, { label: t.title }].filter(Boolean));
  recordRecent('topic', t.topic_id, t.title);
  const issues = DB.idx.issuesByTopic.get(sid(t.topic_id)) || [];
  const addQ = new URLSearchParams({ bab: key || '', topic: t.title || '' }); if (sec) addQ.set('section', sec.title || '');
  let html = `<header class="page-head head-row"><h1>${esc(t.title)}</h1><div class="cta-row" style="margin:0">${issues.length ? `<a class="btn sm" href="#/slides/topic/${encodeURIComponent(t.topic_id)}">▶ عرض شرائح الموضوع</a>` : ''}${topicHeads(t.topic_id).length ? `<a class="btn ghost sm" href="#/tree/topic/${encodeURIComponent(t.topic_id)}">🌳 تشجير</a><a class="btn ghost sm" href="#/cards/topic/${encodeURIComponent(t.topic_id)}">🧠 بطاقات</a>` : ''}${key && issues.length ? `<a class="btn ghost sm" href="#/studio?bab=${key}&topic=${encodeURIComponent(t.topic_id)}">🎞️ استوديو</a>` : ''}${canEdit() && key ? `<a class="btn ghost sm" href="#/edit?${addQ}">➕ إضافة مسألة هنا</a>` : ''}</div></header>${connectionNotice()}`;
  if (has(t.definition)) html += blk('التعريف', paras(t.definition));
  if (has(t.ruling)) html += blk('الحكم', paras(t.ruling));
  const evs = arr(t.evidence_ids).map(e => DB.idx.evidences.get(sid(e))).filter(Boolean);
  if (evs.length) html += blk('الأدلة', evs.map(evidenceCard).join(''));
  TOPIC_LISTS.forEach(([k, label, col]) => { const tb = listTable(t[k], col); if (tb) html += blk(label, tb); });
  if (topicHeads(t.topic_id).length) html += summaryTopic(t);
  if (issues.length) html += `<h2 class="h2">صفحات الموضوع <small>${fmt(issues.length)}</small></h2><div class="pgs">${issues.map(is => {
    const ex = excerpt(splitFoot(is.original_text).body.replace(/\s+/g, ' '), 190);
    return `<div class="pg"><span class="pn"><span>${has(is.page) ? `<small>صـ</small>${esc(is.page)}` : '—'}</span></span>
      <div><p class="pg-ex">${ex ? esc(ex) : MSG.NA_SHORT}</p></div>
      <a class="stretch" href="#/issue/${encodeURIComponent(is.issue_id)}" aria-label="${esc(is.title)}"></a>
      <a class="play btn sm" href="#/slides/issue/${encodeURIComponent(is.issue_id)}" aria-label="عرض شرائح الصفحة">▶</a></div>`;
  }).join('')}</div>`;
  const rids = new Set(arr(t.reference_ids).map(sid));
  issues.forEach(is => arr(is.reference_ids).forEach(r => rids.add(sid(r))));
  TOPIC_LISTS.forEach(([k]) => arr(t[k]).forEach(it => it && has(it.reference_id) && rids.add(sid(it.reference_id))));
  const refs = [...rids].map(r => DB.idx.references.get(r)).filter(Boolean);
  if (refs.length) html += `<h2 class="h2">المصادر والمراجع</h2>` + blk('📚 المصادر', refs.map(r => `<div class="src-card">${citeChip(r.reference_id)}${refFields(r)}</div>`).join(''));

  setView(`<div class="ab${key ? ' ab-' + key : ''}">${html}</div>`);
}

function evidenceCard(e) {
  const chip = citeChip(e.reference_id);
  if (e.type === 'quran') {
    const ref = has(e.surah) && has(e.ayah) ? `[${esc(e.surah)}: ${esc(e.ayah)}]` : has(e.surah) ? `[${esc(e.surah)}]` : `<span class="na">${MSG.REF_INCOMPLETE}</span>`;
    return `<div class="ev quran"><div class="ev-label">📖 الدليل من القرآن الكريم</div><div class="ayah">﴿${esc(e.text)}﴾</div><div class="ref">${ref} ${chip}</div></div>`;
  }
  if (e.type === 'hadith') {
    const f = [['الراوي', e.narrator], ['المصدر', e.collection], ['الكتاب', e.kitab], ['الباب', e.bab], ['رقم الحديث', e.hadith_number]].filter(([, v]) => has(v));
    return `<div class="ev"><div class="ev-label">📜 الدليل من السنة</div><div class="hadith">${esc(e.text)}</div>
      ${f.length ? `<dl class="fields">${f.map(([a, b]) => `<dt>${a}</dt><dd>${esc(b)}</dd>`).join('')}</dl>` : ''}
      ${!has(e.collection) ? `<p class="na" style="margin:.4rem 0 0">${MSG.REF_INCOMPLETE}</p>` : ''}${chip ? `<div class="cites">${chip}</div>` : ''}</div>`;
  }
  return `<div class="ev"><div class="ev-label">الدليل</div><div>${paras(e.text)}</div>${chip ? `<div class="cites">${chip}</div>` : ''}</div>`;
}

function viewIssue(id) {

      <div class="actions">
        <a class="btn" href="#/slides/issue/${encodeURIComponent(is.issue_id)}">▶ شرائح الصفحة</a>
        <button class="btn ghost" data-act="fav" data-id="${esc(is.issue_id)}" aria-pressed="${isFav}">${isFav ? '⭐ في المفضلة' : '⭐ إضافة إلى المفضلة'}</button>
        <button class="btn ghost" data-act="copy" data-id="${esc(is.issue_id)}">📋 نسخ</button>
        <button class="btn ghost" data-act="print">🖨️ طباعة</button>
        <button class="btn ghost" data-act="share" data-title="${esc(is.title)}">🔗 مشاركة</button>
        ${canEdit() ? `<a class="btn ghost" href="#/edit/${encodeURIComponent(is.issue_id)}">✏️ تعديل</a>` : ''}
        <span class="size-ctl" role="group" aria-label="حجم خط النص"><button data-act="fs-down" aria-label="تصغير الخط">أ−</button><button data-act="fs-up" aria-label="تكبير الخط">أ+</button></span>
      </div></header>
    ${connectionNotice()}`;
  html += blk('📖 النص الأصلي', has(txt.body) ? `<div class="nass">${paras(txt.body)}</div>${chips ? `<div class="cites">${chips}</div>` : ''}` : `<p class="na">${MSG.NA}</p>`, 'source-text');
  if (has(txt.foot)) html += blk('الحواشي', `<div class="nass">${paras(txt.foot)}</div>`, 'foot');
  html += blk('⚖️ الحكم', has(is.ruling) ? paras(is.ruling) : `<p class="na">${MSG.NA}</p>`);
  html += blk('الأدلة', evs.length ? evs.map(evidenceCard).join('') : `<p class="na">${MSG.NA}</p>`);
  if (has(is.explanation)) html += blk('💡 شرح وتوضيح', paras(is.explanation), 'sharh');

function issuePlain(is) {
  const c = issueCtx(is), L = [is.title, ''];
  L.push('النص: ' + (has(is.original_text) ? is.original_text : MSG.NA));
  L.push('الحكم: ' + (has(is.ruling) ? is.ruling : MSG.NA));
  const evs = arr(is.evidence_ids).map(e => DB.idx.evidences.get(sid(e))).filter(Boolean);
  L.push('الدليل:' + (evs.length ? '' : ' ' + MSG.NA));
  evs.forEach(e => {
    let s = '- ' + e.text;
    if (e.type === 'quran' && has(e.surah)) s += ` [${e.surah}${has(e.ayah) ? ': ' + e.ayah : ''}]`;
    if (e.type === 'hadith') s += ' (' + [e.narrator, e.collection, has(e.hadith_number) ? 'رقم ' + e.hadith_number : ''].filter(has).join('، ') + ')';
    L.push(s);
  });
  L.push('المصدر: ' + (c.refs.length ? c.refs.map(refPlain).join(' | ') : MSG.NA_SHORT));
  return L.join('\n');
}

/* ---------- Search page ---------- */
function opt(v, l, sel) { return `<option value="${esc(v)}"${sel === sid(v) ? ' selected' : ''}>${esc(l)}</option>`; }
function filterOptions(F) {
  const d = DB.raw, I = DB.idx;
  const babO = '<option value="">كل الأبواب</option>' + BABS.map(b => opt(b.key, b.title, F.bab)).join('');
  const volO = '<option value="">كل الأجزاء</option>' + d.volumes.filter(v => has(v.volume_id)).map(v => opt(v.volume_id, volLabel(v) || v.volume_id, F.vol)).join('');
  const chId = F.bab && I.babChapter.get(F.bab) ? sid(I.babChapter.get(F.bab).chapter_id) : null;
  const secO = '<option value="">كل الفصول</option>' + d.sections.filter(s => has(s.section_id) && I.chapterBab.has(sid(s.chapter_id)) && (!chId || sid(s.chapter_id) === chId)).map(s => opt(s.section_id, s.title, F.sec)).join('');
  const topO = '<option value="">كل الموضوعات</option>' + d.topics.filter(t => has(t.topic_id) && (!chId || topicChapterId(t) === chId) && (!F.sec || sid(t.section_id) === F.sec)).map(t => opt(t.topic_id, t.title, F.topic)).join('');
  const authors = [...new Set(d.books.flatMap(b => arr(b.authors)).filter(has))];
  const autO = '<option value="">كل المؤلفين</option>' + authors.map(a => opt(a, a, F.author)).join('');
  const bookO = '<option value="">كل المصادر</option>' + d.books.filter(b => has(b.book_id)).map(b => opt(b.book_id, b.title || b.book_id, F.book)).join('');
  const typeO = [['', 'كل الأنواع'], ['quran', 'مسائل فيها دليل من القرآن'], ['hadith', 'مسائل فيها دليل من السنة'], ['khilaf', 'مسائل فيها خلاف فقهي']].map(([v, l]) => opt(v, l, F.type)).join('');
  return { babO, volO, secO, topO, autO, bookO, typeO };
}
function pager(total, page, base) {
  const pages = Math.ceil(total / CONFIG.PAGE_SIZE); if (pages <= 1) return '';
  const link = p => { const q = new URLSearchParams(base); q.set('p', p); return '#/search?' + q.toString(); };
  const nums = new Set([1, pages, page - 1, page, page + 1].filter(p => p >= 1 && p <= pages));
  const list = [...nums].sort((a, b) => a - b);
  let out = `<a class="${page === 1 ? 'off' : ''}" href="${link(page - 1)}">السابق</a>`, prev = 0;
  list.forEach(p => { if (p - prev > 1) out += '<span class="gap">…</span>'; out += p === page ? `<span aria-current="page">${fmt(p)}</span>` : `<a href="${link(p)}">${fmt(p)}</a>`; prev = p; });
  out += `<a class="${page === pages ? 'off' : ''}" href="${link(page + 1)}">التالي</a>`;
  return `<nav class="pager" aria-label="الصفحات">${out}</nav>`;
}
function viewSearch(params) {
  currentNav = 'search'; crumbs([HOME, { label: 'البحث' }]);
  const F = {}; ['bab', 'vol', 'sec', 'topic', 'author', 'book', 'type'].forEach(k => F[k] = params.get(k) || '');
  const q = params.get('q') || '', page = Math.max(1, parseInt(params.get('p') || '1', 10) || 1);
  const O = filterOptions(F), anyF = Object.values(F).some(Boolean);
  let results = '';
  if (DB.mode === 'none') results = emptyState(MSG.DISCONNECTED, `البحث يعمل على البيانات بعد ربطها. <a href="#/data">ربط البيانات</a>`);
  else if (!q && !anyF) results = emptyState('اكتب كلمة للبحث، أو اختر باباً من البحث المتقدم.', 'مثال: الوضوء');
  else {
    const { terms, rows } = Api.searchIssues(q, F);
    const total = rows.length, start = (page - 1) * CONFIG.PAGE_SIZE, slice = rows.slice(start, start + CONFIG.PAGE_SIZE);
    const base = {}; if (q) base.q = q; Object.entries(F).forEach(([k, v]) => v && (base[k] = v));
    if (!total) results = emptyState('لا توجد نتائج مطابقة في قاعدة البيانات الحالية.', 'جرّب كلمة أقصر أو امسح الفلاتر.');
    else results = headingMatches(terms) + `<p class="res-count">عرض ${fmt(start + 1)}–${fmt(start + slice.length)} من ${fmt(total)} نتيجة</p><div class="cards">` +
      slice.map(r => {
        const is = r.is, c = r.c;
        const meta = [['الباب', c.chapter?.title], ['الفصل', c.section?.title], ['الجزء', c.volume ? volLabel(c.volume) : null], ['الصفحة', has(c.page) ? `صـ ${c.page}` : null], ['المصدر', c.book?.title]]
          .filter(([, v]) => has(v)).map(([l, v]) => `<span class="pill">${l}: <b>${esc(v)}</b></span>`).join('');
        const sn = snippet(is.original_text || is.ruling || '', terms);
        return `<article class="card res"><h3><a href="#/issue/${encodeURIComponent(is.issue_id)}">${highlight(is.title, terms)}</a></h3>
          ${sn ? `<p class="snip">${sn}</p>` : ''}<div class="row">${meta}<a class="btn sm" href="#/issue/${encodeURIComponent(is.issue_id)}">عرض المسألة</a></div></article>`;
      }).join('') + '</div>' + pager(total, page, base);
  }
  setView(`
    <header class="page-head"><h1>البحث</h1><p>يبحث في العنوان والنص والحكم والموضوع والباب والفصل والكلمات المفتاحية والمؤلف والمصدر والجزء والصفحة، مع مراعاة الهمزات والتاء المربوطة والألف المقصورة والتشكيل.</p></header>
    <form class="search-form" data-form="adv" role="search">
      <div class="search-main"><input type="search" name="q" value="${esc(q)}" placeholder="مثال: الوضوء" aria-label="كلمة البحث"><button class="btn" type="submit">بحث</button></div>
      <details class="adv" ${anyF ? 'open' : ''}><summary>البحث المتقدم</summary>
        <div class="filters">
          <label>الباب<select name="bab" data-dep>${O.babO}</select></label>
          <label>الجزء<select name="vol">${O.volO}</select></label>
          <label>الفصل<select name="sec" data-dep>${O.secO}</select></label>
          <label>الموضوع<select name="topic">${O.topO}</select></label>
          <label>المؤلف<select name="author">${O.autO}</select></label>
          <label>المصدر<select name="book">${O.bookO}</select></label>
          <label>نوع المحتوى<select name="type">${O.typeO}</select></label>
        </div>
        <div class="filter-actions"><button class="btn sm" type="submit">بحث</button><button class="btn ghost sm" type="button" data-act="clear-filters">مسح الفلاتر</button></div>
      </details>
    </form>
    ${results}`);
}

/* ---------- References ---------- */
function viewRefs() {
  currentNav = 'refs'; crumbs([HOME, { label: 'المراجع والمصادر' }]);
  const d = DB.raw, used = new Map();
  const bump = rid => { const r = DB.idx.references.get(sid(rid)); if (r && has(r.book_id)) used.set(sid(r.book_id), (used.get(sid(r.book_id)) || 0) + 1); };
  d.issues.forEach(is => arr(is.reference_ids).forEach(bump));
  d.topics.forEach(t => arr(t.reference_ids).forEach(bump));
  d.evidences.forEach(e => has(e.reference_id) && bump(e.reference_id));
  const books = d.books.filter(b => used.has(sid(b.book_id)));
  const primaryId = sid(d.meta.primary_book_id) || (books[0] ? sid(books[0].book_id) : '');
  const bookCard = b => {
    const f = [['المؤلف', has(b.authors) ? arr(b.authors).join('، ') : null], ['الناشر', b.publisher], ['الطبعة', b.edition], ['سنة النشر', b.year]].filter(([, v]) => has(v));
    const vols = d.volumes.filter(v => sid(v.book_id) === sid(b.book_id)).length;
    return `<div class="card"><h3>${esc(b.title)}</h3>${f.length ? `<dl class="fields">${f.map(([a, v]) => `<dt>${a}</dt><dd>${esc(v)}</dd>`).join('')}</dl>` : ''}
      <div class="row"><span class="pill">مرات الإحالة: <b>${fmt(used.get(sid(b.book_id)))}</b></span>${vols ? `<span class="pill">الأجزاء: <b>${fmt(vols)}</b></span>` : ''}
      ${has(b.source_url) && /^https?:\/\//i.test(b.source_url) ? `<a class="btn ghost sm" href="${esc(b.source_url)}" target="_blank" rel="noopener">عرض المصدر الأصلي</a>` : ''}</div></div>`;
  };
  let html = `<header class="page-head"><h1>المراجع والمصادر</h1><p>تُعرض هنا المصادر المستخدمة فعلياً في البيانات فقط.</p></header>${connectionNotice()}`;
  if (!books.length) html += emptyState('لا توجد مصادر مستخدمة في قاعدة البيانات الحالية.', noDataBody());
  else {
    const prim = books.find(b => sid(b.book_id) === primaryId), others = books.filter(b => b !== prim);
    if (prim) html += `<h2 class="h2">المصدر الأساسي</h2><div class="cards">${bookCard(prim)}</div>`;
    if (others.length) html += `<h2 class="h2">مصادر أخرى</h2><div class="cards">${others.map(bookCard).join('')}</div>`;
    html += `<h2 class="h2">فهرس الإحالات <small>${fmt(d.references.length)}</small></h2>` + blk('📚 الإحالات', d.references.map(r => `<div class="src-card">${citeChip(r.reference_id)}${refFields(r)}</div>`).join(''));
  }
  setView(html);
}

/* ======================= العناوين الفرعية: الهيكل · الملخص · التشجير · البطاقات =======================

const BAB_COL = { taharah: ['#1F6F8B', '#0B3647'], salah: ['#1B6B4C', '#0A3426'], zakah: ['#9A7420', '#4A3510'], siyam: ['#5E4D93', '#271F4D'], hajj: ['#A8502F', '#55220F'] };

const enc = encodeURIComponent;
const topicIssues = t => DB.idx.issuesByTopic.get(sid(t.topic_id)) || [];
const topicHeads = tid => DB.idx.headingsByTopic.get(sid(tid)) || [];

function headPath(h) { const out = []; let x = h; while (x) { out.unshift(x); x = has(x.parent_id) ? DB.idx.headings.get(sid(x.parent_id)) : null; } return out; }
function headPage(h) {
  const is = DB.idx.issues.get(sid(h.issue_id)); if (!is) return '';

  return [v ? volLabel(v) : '', has(is.page) ? `صـ ${is.page}` : ''].filter(Boolean).join(' · ');
}
const headLink = h => `#/section/${enc(h.heading_id)}`;

function splitNotes(foot) {
  const out = [];
  String(foot || '').split('\n').forEach(l => {
    const m = /^\s*(\([^)\s]{1,6}\))/.exec(l);
    if (m || !out.length) out.push({ mark: m ? m[1] : '', text: l.trim() }); else out[out.length - 1].text += '\n' + l.trim();
  });
  return out.filter(n => n.text);
}
/* يقطع نص موضوع إلى كتل: كتلة تمهيدية (قبل أول عنوان) ثم كتلة لكل عنوان (نصه الخاص إلى العنوان التالي).
   كل كتلة: { h, segs:[{ is, text, notes[] }] } — وتُنسب الحاشية إلى المقطع الذي يذكر رقمها، والباقي إلى آخر مقطع في صفحتها. */
function topicBlocks(t) {
  const key = sid(t.topic_id); if (BLOCKS.has(key)) return BLOCKS.get(key);
  const iss = topicIssues(t), hs = topicHeads(t.topic_id), parts = iss.map(is => splitFoot(is.original_text));
  const cuts = [{ h: null, k: 0, off: 0 }]; let pk = 0, po = 0;
  hs.forEach(h => {
    let k = iss.findIndex(i => sid(i.issue_id) === sid(h.issue_id)), off = +h.offset || 0;
    if (k < 0) k = pk;
    if (k < pk || (k === pk && off < po)) { k = pk; off = po; }
    cuts.push({ h, k, off }); pk = k; po = off;
  });
  const blocks = cuts.map((c, i) => {
    const nx = cuts[i + 1], endK = nx ? nx.k : iss.length - 1, segs = [];
    for (let k = c.k; k <= endK && k < iss.length; k++) {
      const body = parts[k].body, a = k === c.k ? c.off : 0, z = nx && k === endK ? nx.off : body.length;
      const text = body.slice(a, z).trim();
      if (text) segs.push({ is: iss[k], text, notes: [] });
    }
    return { h: c.h, segs };
  });
  iss.forEach((is, k) => {
    const notes = splitNotes(parts[k].foot); if (!notes.length) return;
    const mine = []; blocks.forEach(b => b.segs.forEach(sg => { if (sg.is === is) mine.push(sg); }));
    if (!mine.length) return;
    notes.forEach(n => (((n.mark && mine.find(m => m.text.includes(n.mark))) || mine[mine.length - 1]).notes.push(n.text)));

  const res = blocks.filter(b => b.segs.length);
  BLOCKS.set(key, res); return res;
}
/* كتل عنوان وأحفاده (inclusive) أو كتلته وحدها */
function sectionBlocks(h, inclusive = true) {
  const t = Api.getTopicById(h.topic_id); if (!t) return [];
  const bl = topicBlocks(t), i = bl.findIndex(b => b.h === h); if (i < 0) return [];
  if (!inclusive) return [bl[i]];

  return bl.slice(i, j);
}
const blockText = b => b.segs.map(s => s.text).join('\n');
function ownText(b) { // بلا سطر العنوان نفسه (للعرض فقط)
  let lines = blockText(b).split('\n');
  if (b.h && lines.length > 1 && lines[0].length < b.h.title.length + 40 && norm(lines[0]).includes(norm(b.h.title))) lines = lines.slice(1);
  return lines.join('\n').trim();
}
function leadOf(h, max = 230) {
  const b = sectionBlocks(h, false)[0]; if (!b) return '';
  return excerpt(ownText(b).replace(/\s+/g, ' '), max);
}
function topicStats(t) { const hs = topicHeads(t.topic_id); return { pages: topicIssues(t).length, subs: hs.length, top: hs.filter(h => !h.parent_id).length }; }
const statStrip = items => `<div class="statstrip">${items.filter(Boolean).map(([n, l]) => `<div><b>${fmt(n)}</b><span>${l}</span></div>`).join('')}</div>`;
const sumNote = () => `<p class="na sm">${SUMMARY_NOTE}</p>`;
const AI_NOTE = 'ملخص مصوغ آلياً من نص الكتاب وحده؛ وتحقق الفحص الآلي من أن ألفاظه واردة في النص. المرجع هو النص الأصلي — راجعه قبل الاعتماد.';
const summaryOf = (level, id) => DB.idx.summaryBy.get(level + ':' + sid(id)) || null;
/* الأدلة تُنتقى من نص الكتاب نفسه (حرفياً): آيات بين ﴿ ﴾ مع مرجعها، وأسطر الأحاديث («روى/رواه/أخرجه») */
function extractDalil(text) {
  const out = [], seen = new Set(); text = String(text || '');
  const push = d => { const k = norm(d.text).slice(0, 50); if (k && !seen.has(k)) { seen.add(k); out.push(d); } };
  const rq = /﴿([^﴾]{3,420})﴾\s*(?:[\[\(]([^\]\)\n]{2,40})[\]\)])?/g; let m;
  while ((m = rq.exec(text))) push({ kind: 'quran', text: m[1].trim(), ref: m[2] ? m[2].trim() : '' });
  text.split('\n').forEach(l => {
    l = l.trim(); if (l.length < 30 || !/(روى|رواه|أخرجه|رواها)/.test(l)) return;
    // متن الحديث: نص بين علامتي تنصيص يسبقه «:» أو فيه ﷺ، مع «قال …» قبله وإحالته بعده — كلّه مقطع حرفي من السطر
    let best = null; const rx = /"[^"]{8,420}"/g; let q;
    while ((q = rx.exec(l))) { const inner = q[0]; if (/(رواه|روى)/.test(inner)) continue; if (/[:：]\s*$/.test(l.slice(Math.max(0, q.index - 3), q.index)) || inner.includes('ﷺ')) { best = q; break; } }
    if (best && !/^و?روى/.test(l)) {
      const back = l.slice(Math.max(0, best.index - 80), best.index), k = back.lastIndexOf('قال');
      let a = k > -1 ? best.index - back.length + k : best.index;
      let z = best.index + best[0].length; const tail = /^\s*[\[\(][^\]\)]{2,90}[\]\)]/.exec(l.slice(z)); if (tail) z += tail[0].length;
      push({ kind: 'hadith', text: excerpt(l.slice(a, z).trim(), 320), ref: '' });
    } else {
      const m2 = /(و?روى|رواه|أخرجه|رواها)/.exec(l), back = l.slice(0, m2.index), cut = Math.max(back.lastIndexOf('.'), back.lastIndexOf('؛'));
      push({ kind: 'hadith', text: excerpt(l.slice(cut > -1 && m2.index - cut < 160 ? cut + 1 : Math.max(0, back.lastIndexOf(' ', Math.max(0, m2.index - 120)) + 1)).trim(), 300), ref: '' });
    }
  });

}
const MS_RX = /^\s*(?:[٠-٩0-9]+\s*[ـ\-\.\)]|[أ-ي]\s*ـ|(?:أولاً|ثانياً|ثالثاً|رابعاً|خامساً|سادساً|سابعاً|ثامناً|تاسعاً|عاشراً)\s*[:ـ\-]?)/;

  const ms = sm && sm.masail.length ? sm.masail : masailFallback(own);

}

/* ---------- صفحة العنوان الفرعي ---------- */
function viewSection(id) {
  const h = Api.getHeadingById(id); if (!h) return viewNotFound('العنوان');
  const t = Api.getTopicById(h.topic_id); if (!t) return viewNotFound('الموضوع');
  const key = babOfTopic(t), path = headPath(h);

    ...path.slice(0, -1).map(p => ({ label: p.title, href: headLink(p) })), { label: h.title }].filter(Boolean));
  const bl = sectionBlocks(h, true), hs = topicHeads(t.topic_id), pos = hs.indexOf(h);
  const prev = pos > 0 ? hs[pos - 1] : null, next = pos > -1 && pos < hs.length - 1 ? hs[pos + 1] : null;
  const pages = [...new Set(bl.flatMap(b => b.segs.map(s => s.is)))];

function issueHeadingChips(is) {
  const t = Api.getTopicById(is.topic_id); if (!t) return '';
  const hs = topicHeads(t.topic_id); if (!hs.length) return '';
  const iss = topicIssues(t), k = iss.indexOf(is);

function htmlToText(html, mdHeads) {

    }

function saveIssue(form) {
  const g = n => (form.elements[n]?.value || '').trim();
  const babKey = g('bab'), title = g('title'), topicT = g('topic');
  if (!babKey || !title || !topicT) { toast('أكمل الحقول المطلوبة: الباب والموضوع والعنوان'); return; }
  const d = JSON.parse(JSON.stringify(DB.raw)), same = (a, b) => norm(a) === norm(b), editId = form.dataset.id;
  const bab = BABS.find(b => b.key === babKey);
  let ch = d.chapters.find(c => c.key === babKey || same(c.title, bab.title));
  if (!ch) { ch = { chapter_id: nid('c'), key: babKey, title: bab.title, order: babIdx(babKey) + 1 }; d.chapters.push(ch); }
  const chId = sid(ch.chapter_id);
  const tChap = t => has(t.chapter_id) ? sid(t.chapter_id) : sid(d.sections.find(s => sid(s.section_id) === sid(t.section_id))?.chapter_id);
  let sec = null; const secT = g('section');
  if (secT) {
    sec = d.sections.find(s => sid(s.chapter_id) === chId && same(s.title, secT));
    if (!sec) { sec = { section_id: nid('s'), chapter_id: ch.chapter_id, title: secT, order: d.sections.filter(s => sid(s.chapter_id) === chId).length + 1 }; d.sections.push(sec); }
  }
  let tp = d.topics.find(t => tChap(t) === chId && same(t.title, topicT));
  if (!tp) { tp = { topic_id: nid('t'), chapter_id: ch.chapter_id, title: topicT, order: d.topics.filter(t => tChap(t) === chId).length + 1 }; d.topics.push(tp); }
  if (sec) tp.section_id = sec.section_id;
  if (g('topic_def')) tp.definition = g('topic_def');

  let bk = null; const bookT = g('book');
  if (bookT) {
    bk = d.books.find(b => same(b.title, bookT));
    if (!bk) { bk = { book_id: nid('b'), title: bookT }; d.books.push(bk); }
    if (!has(d.meta.primary_book_id)) d.meta.primary_book_id = bk.book_id;
    const au = g('authors').split(/[،,]/).map(x => x.trim()).filter(Boolean);
    if (au.length) bk.authors = au;
  }
  let vol = null; const volT = g('volume');
  if (volT && bk) {
    vol = d.volumes.find(v => sid(v.book_id) === sid(bk.book_id) && (sid(v.number) === volT || sid(v.title) === volT));
    if (!vol) { vol = { volume_id: nid('v'), book_id: bk.book_id, number: /^\d+$/.test(volT) ? Number(volT) : volT }; d.volumes.push(vol); }
  }

  let is = editId ? d.issues.find(i => sid(i.issue_id) === editId) : null;
  const isNew = !is;
  if (isNew) { is = { issue_id: nid('i'), order: d.issues.filter(i => sid(i.topic_id) === sid(tp.topic_id)).length + 1 }; d.issues.push(is); }
  is.topic_id = tp.topic_id; delete is.section_id; delete is.chapter_id;
  is.title = title;
  ['original_text', 'ruling', 'explanation', 'notes'].forEach(k => setOpt(is, k, g(k)));
  setOpt(is, 'keywords', g('keywords').split(/[،,]/).map(x => x.trim()).filter(Boolean));

  if (bk) {
    delete is.page; delete is.volume_id; delete is.book_id;
    const firstId = sid(arr(is.reference_ids)[0]);
    let ref = firstId ? d.references.find(r => sid(r.reference_id) === firstId) : null;
    const shared = ref && d.issues.some(o => o !== is && arr(o.reference_ids).map(sid).includes(firstId));
    if (!ref || shared) {
      ref = { reference_id: nid('r') }; d.references.push(ref);
      const rest = arr(is.reference_ids).filter(r => !(shared && sid(r) === firstId));
      is.reference_ids = [ref.reference_id].concat(rest);
    }
    ref.book_id = bk.book_id; ref.source_type = 'book'; ref.chapter_title = bab.title;
    setOpt(ref, 'volume_id', vol?.volume_id); setOpt(ref, 'section_title', sec?.title);
    setOpt(ref, 'page', g('page')); setOpt(ref, 'url', g('url'));
  }

  const old = arr(is.evidence_ids).map(sid), usedElse = new Set();
  d.issues.forEach(o => { if (o !== is) arr(o.evidence_ids).forEach(e => usedElse.add(sid(e))); });
  d.topics.forEach(t => arr(t.evidence_ids).forEach(e => usedElse.add(sid(e))));
  d.evidences = d.evidences.filter(e => !(old.includes(sid(e.evidence_id)) && !usedElse.has(sid(e.evidence_id))));
  is.evidence_ids = [];
  form.querySelectorAll('[data-ev]').forEach(row => {
    const q = n => (row.querySelector(`[name=${n}]`)?.value || '').trim();
    const text = q('ev_text'); if (!text) return;
    const type = q('ev_type'), e = { evidence_id: nid('e'), type, text };
    if (type === 'quran') { setOpt(e, 'surah', q('ev_surah')); setOpt(e, 'ayah', q('ev_ayah')); }
    if (type === 'hadith') { setOpt(e, 'narrator', q('ev_narrator')); setOpt(e, 'collection', q('ev_collection')); setOpt(e, 'hadith_number', q('ev_number')); }
    d.evidences.push(e); is.evidence_ids.push(e.evidence_id);
  });
  if (!is.evidence_ids.length) delete is.evidence_ids;

  commitData(d);
  toast(isNew ? 'تم حفظ المسألة' : 'تم حفظ التعديلات');
  location.hash = '#/issue/' + encodeURIComponent(is.issue_id);
}

function deleteIssue(id) {
  if (!confirm('حذف هذه المسألة نهائياً من بياناتك؟')) return;
  const d = JSON.parse(JSON.stringify(DB.raw));
  const is = d.issues.find(i => sid(i.issue_id) === sid(id)); if (!is) return;
  d.issues = d.issues.filter(i => i !== is);
  const usedE = new Set(), usedR = new Set();
  d.issues.forEach(o => { arr(o.evidence_ids).forEach(e => usedE.add(sid(e))); arr(o.reference_ids).forEach(r => usedR.add(sid(r))); arr(o.khilaf).forEach(k => k && usedR.add(sid(k.reference_id))); });
  d.topics.forEach(t => { arr(t.evidence_ids).forEach(e => usedE.add(sid(e))); arr(t.reference_ids).forEach(r => usedR.add(sid(r))); });
  d.evidences.forEach(e => has(e.reference_id) && usedR.add(sid(e.reference_id)));
  d.evidences = d.evidences.filter(e => !arr(is.evidence_ids).map(sid).includes(sid(e.evidence_id)) || usedE.has(sid(e.evidence_id)));
  d.references = d.references.filter(r => !arr(is.reference_ids).map(sid).includes(sid(r.reference_id)) || usedR.has(sid(r.reference_id)));
  const tp = d.topics.find(t => sid(t.topic_id) === sid(is.topic_id));
  const topicLeft = tp && (d.issues.some(i => sid(i.topic_id) === sid(tp.topic_id)) || has(tp.definition) || has(tp.ruling) || TOPIC_LISTS.some(([k]) => has(tp[k])));
  if (tp && !topicLeft) {
    d.topics = d.topics.filter(t => t !== tp);
    if (has(tp.section_id) && !d.topics.some(t => sid(t.section_id) === sid(tp.section_id))) d.sections = d.sections.filter(s => sid(s.section_id) !== sid(tp.section_id));
  }
  store.set('favs', store.get('favs', []).filter(f => f !== sid(id)));
  commitData(d);
  toast('تم حذف المسألة');
  location.hash = topicLeft ? '#/topic/' + encodeURIComponent(tp.topic_id) : '#/';
}

function excerpt(t, n) {
  t = String(t ?? '').replace(/[ \t]+/g, ' ').replace(/\n{2,}/g, '\n').trim();

  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act;
  if (act === 'file' || act === 'textfile') return;
  if (act === 'menu') { document.body.classList.toggle('nav-open'); return; }
  if (act === 'menu-close') { document.body.classList.remove('nav-open'); return; }
  if (act === 'theme') { const n = currentTheme() === 'dark' ? 'light' : 'dark'; store.set('theme', n); applyTheme(n); return; }
  if (act === 'cite') {
    const r = DB.idx.references.get(el.dataset.ref); if (!r) return;
    $('#citeTitle').textContent = `بيانات المصدر ${refNo(r.reference_id)}`;
    $('#citeBody').innerHTML = refFields(r);
    const dlg = $('#citeDialog'); if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', ''); return;
  }
  if (act === 'close-dialog') { const dlg = $('#citeDialog'); dlg.close ? dlg.close() : dlg.removeAttribute('open'); return; }
  if (act === 'fav' || act === 'unfav') {
    const id = el.dataset.id; let favs = store.get('favs', []);
    if (favs.includes(id)) { favs = favs.filter(x => x !== id); toast('تمت إزالة المسألة من المفضلة'); }
    else { favs.push(id); toast('تمت الإضافة إلى المفضلة'); }
    store.set('favs', favs);
    if (act === 'unfav') viewFavs(); else { const on = favs.includes(id); el.setAttribute('aria-pressed', on); el.textContent = on ? '⭐ في المفضلة' : '⭐ إضافة إلى المفضلة'; }
    return;
  }
  if (act === 'copy') { const is = Api.getIssueById(el.dataset.id); if (is) toast(await copyText(issuePlain(is)) ? 'تم نسخ النص' : 'تعذّر النسخ'); return; }
  if (act === 'print') { window.print(); return; }
  if (act === 'share') {
    const url = location.href, title = el.dataset.title || document.title;
    if (navigator.share) { try { await navigator.share({ title, url }); return; } catch (err) { if (err && err.name === 'AbortError') return; } }
    toast(await copyText(url) ? 'تم نسخ الرابط' : 'تعذّر نسخ الرابط'); return;
  }
  if (act === 'clear-filters') { location.hash = '#/search'; return; }
  if (act === 'clear-recent') { store.del('recent'); viewRecent(); return; }
  if (act === 'load-demo') { store.set('mode', 'demo'); setData(makeDemo(), 'demo'); toast('تم تحميل البيانات التجريبية'); refresh(); return; }
  if (act === 'disconnect') {
    if (DB.mode === 'demo') {
      store.del('mode'); const saved = await loadUserData();
      setData(hasAnyData(saved) ? saved : EMBEDDED, hasAnyData(saved) ? 'imported' : 'embedded');
      toast('تم الخروج من الوضع التجريبي'); refresh(); return;
    }
    if (!confirm('سيُحذف ما حُفظ من بيانات في هذا المتصفح. هل صدّرت نسخة منها؟')) return;
    await clearUserData(); store.del('mode'); setData(EMBEDDED, 'embedded'); toast('تم فصل البيانات'); refresh(); return;
  }
  if (act === 'fs-up' || act === 'fs-down') {
    const v = Math.min(1.6, Math.max(0.85, +(store.get('fs', 1) + (act === 'fs-up' ? 0.1 : -0.1)).toFixed(2)));
    store.set('fs', v); document.documentElement.style.setProperty('--fs', v); return;
  }
  if (act === 'add-ev') { $('#evList').insertAdjacentHTML('beforeend', evRowHtml()); const rows = document.querySelectorAll('[data-ev]'); const row = rows[rows.length - 1]; syncEv(row); row.querySelector('textarea').focus(); return; }
  if (act === 'rm-ev') { el.closest('[data-ev]').remove(); return; }
  if (act === 'commit-import') { commitImport(); return; }
  if (act === 'cancel-import') { pendingImport = null; $('#importPreview').innerHTML = ''; return; }
  if (act === 'del-issue') { deleteIssue(el.dataset.id); return; }
  if (act === 'export') {
    const json = JSON.stringify(DB.raw, null, 2), box = $('#exportBox');
    box.hidden = false; box.querySelector('textarea').value = json;
    if (await saveFile('fiqh-data.json', json)) return;
    toast(await copyText(json) ? 'تم نسخ البيانات (JSON)' : 'انسخ البيانات من المربع'); return;
  }
  if (act === 'load-paste') { importJson($('#jsonPaste').value); return; }
  if (act === 'copy-schema') { toast(await copyText(JSON.stringify(SCHEMA_EXAMPLE, null, 2)) ? 'تم نسخ القالب' : 'تعذّر النسخ'); return; }
});
$('#citeDialog').addEventListener('click', e => { if (e.target === e.currentTarget) e.currentTarget.close(); });

function importJson(text) {
  let obj;
  try { obj = JSON.parse(text); } catch (e) { toast('الملف ليس JSON صالحاً'); log.error('JSON غير صالح', e); return; }
  if (!hasAnyData(obj)) { toast('لم يُعثر على أي مجموعة بيانات معروفة في الملف'); return; }
  setData(obj, 'imported');
  store.del('mode');
  saveUserData(obj).then(ok => toast(ok ? 'تم تحميل البيانات وحفظها في هذا المتصفح' : 'تم تحميل البيانات لهذه الجلسة فقط'));
  refresh();
}
document.addEventListener('change', e => {
  const t = e.target;
  if (t.matches('input[type=file][data-act=file]') && t.files[0]) {
    const fr = new FileReader(); fr.onload = () => importJson(fr.result); fr.onerror = () => toast('تعذّرت قراءة الملف'); fr.readAsText(t.files[0], 'utf-8'); return;
  }
  if (t.matches('input[type=file][data-act=textfile]') && t.files[0]) {
    const file = t.files[0], form = $('#importForm'), info = $('#rawInfo');
    info.textContent = 'جارٍ القراءة…';
    (async () => {
      try {
        const isEpub = /\.epub$/i.test(file.name) || file.type === 'application/epub+zip';
        const text = isEpub ? await epubToText(file, form.elements.mdHeads.checked) : await file.text();
        form.elements.raw.value = text;
        info.textContent = `${file.name}: ${fmt(text.length)} حرفاً`;
        toast('تمت قراءة الملف');
      } catch (err) {
        log.error(err); info.textContent = '';
        toast(err.message === 'JSZip' ? 'تعذّر تحميل قارئ EPUB؛ تحقق من الاتصال' : 'تعذّرت قراءة الملف: ' + err.message);
      }
      t.value = '';
    })();
    return;
  }
  if (t.matches('[name=ev_type]')) { syncEv(t.closest('[data-ev]')); return; }
  if (t.matches('[data-form=adv] select[data-dep]')) {
    const form = t.form, F = {};
    ['bab', 'vol', 'sec', 'topic', 'author', 'book', 'type'].forEach(k => F[k] = form.elements[k].value);
    if (t.name === 'bab') { F.sec = ''; F.topic = ''; } else F.topic = '';
    const O = filterOptions(F);
    form.elements.sec.innerHTML = O.secO; form.elements.topic.innerHTML = O.topO;
  }
});
document.addEventListener('submit', e => {
  const form = e.target.closest('[data-form]'); if (!form) return;
  e.preventDefault();
  const q = (form.elements.q?.value || '').trim();
  if (form.dataset.form === 'edit') { saveIssue(form); return; }
  if (form.dataset.form === 'studio') { studioGenerate(form); return; }
  if (form.dataset.form === 'import') {
    const raw = form.elements.raw.value;
    if (!raw.trim()) { toast('الصق النص أو ارفع ملفاً أولاً'); return; }
    const o = readImportOpts(form);
    try { const R = parseBookText(raw, o); pendingImport = { R, o }; renderImportPreview(R, o); }
    catch (err) { log.error(err); toast('تعذّر تقسيم النص'); }
    return;
  }
  if (form.dataset.form === 'quick') { location.hash = '#/search' + (q ? '?q=' + encodeURIComponent(q) : ''); form.elements.q.blur(); return; }
  const p = new URLSearchParams(); if (q) p.set('q', q);
  ['bab', 'vol', 'sec', 'topic', 'author', 'book', 'type'].forEach(k => { const v = form.elements[k]?.value; if (v) p.set(k, v); });
  const next = '#/search' + (p.toString() ? '?' + p.toString() : '');
  if (location.hash === next) render(); else location.hash = next;
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') document.body.classList.remove('nav-open'); });
window.addEventListener('hashchange', render);

/* ======================= INIT ======================= */
let EMBEDDED = emptyData();
(async function init() {
  applyTheme(store.get('theme', null));
  await loadDecks();
  document.documentElement.style.setProperty('--fs', store.get('fs', 1));
  try { EMBEDDED = JSON.parse($('#fiqh-data').textContent); } catch (e) { log.error('تعذّرت قراءة البيانات المضمّنة', e); }
  if (store.get('mode', null) === 'demo') setData(makeDemo(), 'demo');
  else {
    const saved = await loadUserData();
    if (hasAnyData(saved)) setData(saved, 'imported');
    else if (hasAnyData(EMBEDDED)) setData(EMBEDDED, 'embedded');
    else {
      setData(EMBEDDED, 'embedded');
      refresh();
      const remote = await tryRemote();
      if (remote) { setData(remote, 'remote'); refresh(); }
      return;
    }
  }
  refresh();
})();
</script>
